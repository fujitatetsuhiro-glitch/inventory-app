<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簡単在庫管理アプリ</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #2f6fed;
      --primary-dark: #1f56c4;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --in: #0f9d58;
      --out: #d93025;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px 24px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: var(--primary-dark); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th { color: var(--muted); font-weight: 600; }

    .type-in { color: var(--in); font-weight: 700; }
    .type-out { color: var(--out); font-weight: 700; }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (min-width: 840px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .full {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>簡単在庫管理アプリ</h1>

    <div class="grid">
      <section class="card full">
        <h2>在庫を登録</h2>
        <form id="stockForm">
          <div>
            <label for="name">商品名</label>
            <input id="name" name="name" type="text" placeholder="例: ボールペン" required />
          </div>

          <div>
            <label for="quantity">数量</label>
            <input id="quantity" name="quantity" type="number" min="1" step="1" required />
          </div>

          <div>
            <label for="type">種別</label>
            <select id="type" name="type" required>
              <option value="in">入庫</option>
              <option value="out">出庫</option>
            </select>
          </div>

          <div>
            <button type="submit">登録</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>現在庫（商品ごと）</h2>
        <div id="inventoryWrap">
          <p class="empty">まだデータがありません。</p>
        </div>
      </section>

      <section class="card">
        <h2>履歴</h2>
        <div id="historyWrap">
          <p class="empty">まだ履歴がありません。</p>
        </div>
      </section>
    </div>
  </div>

  <script>
    const form = document.getElementById('stockForm');
    const inventoryWrap = document.getElementById('inventoryWrap');
    const historyWrap = document.getElementById('historyWrap');

    const records = [];

    const formatDateTime = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      const ss = String(date.getSeconds()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    };

    const calculateInventory = () => {
      const stockMap = {};
      for (const r of records) {
        if (!stockMap[r.name]) stockMap[r.name] = 0;
        stockMap[r.name] += r.type === 'in' ? r.quantity : -r.quantity;
      }
      return stockMap;
    };

    const renderInventory = () => {
      const stockMap = calculateInventory();
      const names = Object.keys(stockMap).sort((a, b) => a.localeCompare(b, 'ja'));

      if (names.length === 0) {
        inventoryWrap.innerHTML = '<p class="empty">まだデータがありません。</p>';
        return;
      }

      const rows = names.map(name => `
        <tr>
          <td>${name}</td>
          <td>${stockMap[name]}</td>
        </tr>
      `).join('');

      inventoryWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>商品名</th>
              <th>現在庫</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    };

    const renderHistory = () => {
      if (records.length === 0) {
        historyWrap.innerHTML = '<p class="empty">まだ履歴がありません。</p>';
        return;
      }

      const rows = [...records].reverse().map(r => `
        <tr>
          <td>${r.time}</td>
          <td>${r.name}</td>
          <td class="${r.type === 'in' ? 'type-in' : 'type-out'}">${r.type === 'in' ? '入庫' : '出庫'}</td>
          <td>${r.quantity}</td>
        </tr>
      `).join('');

      historyWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>商品名</th>
              <th>種別</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const name = String(formData.get('name') || '').trim();
      const quantity = Number(formData.get('quantity'));
      const type = String(formData.get('type'));

      if (!name || !Number.isInteger(quantity) || quantity <= 0 || !['in', 'out'].includes(type)) {
        return;
      }

      records.push({
        name,
        quantity,
        type,
        time: formatDateTime(new Date())
      });

      renderInventory();
      renderHistory();
      form.reset();
      form.elements.type.value = 'in';
      form.elements.quantity.value = '1';
      form.elements.name.focus();
    });

    form.elements.quantity.value = '1';
  </script>
</body>
</html>
