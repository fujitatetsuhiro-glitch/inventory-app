<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簡単在庫管理アプリ</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #2f6fed;
      --primary-dark: #1f56c4;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --in: #0f9d58;
      --out: #d93025;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 960px;
      margin: 20px auto;
      padding: 0 12px 20px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(1.35rem, 4.5vw, 1.8rem);
      line-height: 1.3;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
      appearance: none;
      -webkit-appearance: none;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: var(--primary-dark); }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      min-width: 360px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th { color: var(--muted); font-weight: 600; }

    .type-in { color: var(--in); font-weight: 700; }
    .type-out { color: var(--out); font-weight: 700; }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 640px) {
      .card {
        padding: 14px;
      }

      form {
        grid-template-columns: 1fr;
      }

      input, select, button {
        min-height: 44px;
        font-size: 1rem;
      }

      table {
        min-width: 0;
      }

      thead {
        display: none;
      }

      tbody tr {
        display: block;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }

      tbody tr:last-child {
        margin-bottom: 0;
      }

      td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border: none;
        word-break: break-word;
      }

      td::before {
        flex-shrink: 0;
      }

      td > span {
        text-align: right;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
      }
    }

    @media (min-width: 840px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .full {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>簡単在庫管理アプリ</h1>

    <div class="grid">
      <section class="card full">
        <h2>在庫を登録</h2>
        <form id="stockForm">
          <div>
            <label for="name">商品名</label>
            <input id="name" name="name" type="text" placeholder="例: ボールペン" required />
          </div>

          <div>
            <label for="quantity">数量</label>
            <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" step="1" required />
          </div>

          <div>
            <label for="type">種別</label>
            <select id="type" name="type" required>
              <option value="in">入庫</option>
              <option value="out">出庫</option>
            </select>
          </div>

          <div>
            <button type="submit">登録</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>現在庫（商品ごと）</h2>
        <div id="inventoryWrap">
          <p class="empty">まだデータがありません。</p>
        </div>
      </section>

      <section class="card">
        <h2>履歴</h2>
        <button id="downloadCsv" type="button" style="margin-bottom: 12px;">CSVダウンロード</button>
        <div id="historyWrap">
          <p class="empty">まだ履歴がありません。</p>
        </div>
      </section>
    </div>
  </div>

  <script>
    const form = document.getElementById('stockForm');
    const inventoryWrap = document.getElementById('inventoryWrap');
    const historyWrap = document.getElementById('historyWrap');
    const downloadCsvButton = document.getElementById('downloadCsv');
    const nameInput = document.getElementById('name');
    const quantityInput = document.getElementById('quantity');
    const typeSelect = document.getElementById('type');

    const STORAGE_KEY = 'inventory-records';
    const records = [];

    const saveRecords = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    };

    const loadRecords = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return;

        for (const item of parsed) {
          const name = String(item?.name || '').trim();
          const quantity = Number(item?.quantity);
          const type = item?.type;
          const time = String(item?.time || '');

          if (!name || !Number.isInteger(quantity) || quantity <= 0) continue;
          if (!['in', 'out'].includes(type)) continue;
          if (!time) continue;

          records.push({ name, quantity, type, time });
        }
      } catch (_) {
        // 保存データが壊れている場合は読み込みをスキップ
      }
    };

    const formatDateTime = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      const ss = String(date.getSeconds()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    };

    const calculateInventory = () => {
      const stockMap = {};
      for (const r of records) {
        if (!stockMap[r.name]) stockMap[r.name] = 0;
        stockMap[r.name] += r.type === 'in' ? r.quantity : -r.quantity;
      }
      return stockMap;
    };



    const escapeCsv = (value) => {
      const text = String(value ?? '');
      if (/[",\n]/.test(text)) {
        return `"${text.replace(/"/g, '""')}"`;
      }
      return text;
    };

    const downloadCsv = () => {
      const header = ['日時', '商品名', '種別', '数量'];
      const lines = records.map((record) => [
        record.time,
        record.name,
        record.type === 'in' ? '入庫' : '出庫',
        record.quantity
      ]);
      const csvBody = [header, ...lines]
        .map((row) => row.map((cell) => escapeCsv(cell)).join(','))
        .join('\n');
      const bom = '\uFEFF';
      const blob = new Blob([bom + csvBody], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `inventory-history-${formatDateTime(new Date()).replace(/[ :]/g, '-')}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };

    const renderInventory = () => {
      const stockMap = calculateInventory();
      const names = Object.keys(stockMap).sort((a, b) => a.localeCompare(b, 'ja'));

      if (names.length === 0) {
        inventoryWrap.innerHTML = '<p class="empty">まだデータがありません。</p>';
        return;
      }

      const rows = names.map(name => `
        <tr>
          <td data-label="商品名"><span>${name}</span></td>
          <td data-label="現在庫"><span>${stockMap[name]}</span></td>
        </tr>
      `).join('');

      inventoryWrap.innerHTML = `
        <div class="table-scroll">
          <table>
          <thead>
            <tr>
              <th>商品名</th>
              <th>現在庫</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      `;
    };

    const renderHistory = () => {
      if (records.length === 0) {
        historyWrap.innerHTML = '<p class="empty">まだ履歴がありません。</p>';
        return;
      }

      const rows = [...records].reverse().map(r => `
        <tr>
          <td data-label="日時"><span>${r.time}</span></td>
          <td data-label="商品名"><span>${r.name}</span></td>
          <td data-label="種別" class="${r.type === 'in' ? 'type-in' : 'type-out'}"><span>${r.type === 'in' ? '入庫' : '出庫'}</span></td>
          <td data-label="数量"><span>${r.quantity}</span></td>
        </tr>
      `).join('');

      historyWrap.innerHTML = `
        <div class="table-scroll">
          <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>商品名</th>
              <th>種別</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      `;
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const name = String(formData.get('name') || '').trim();
      const quantity = Number(formData.get('quantity'));
      const type = String(formData.get('type'));

      if (!name || !Number.isInteger(quantity) || quantity <= 0 || !['in', 'out'].includes(type)) {
        return;
      }

      records.push({
        name,
        quantity,
        type,
        time: formatDateTime(new Date())
      });

      saveRecords();
      renderInventory();
      renderHistory();
      form.reset();
      typeSelect.value = 'in';
      quantityInput.value = '1';

      if (window.matchMedia('(min-width: 641px)').matches) {
        nameInput.focus();
      }
    });

    downloadCsvButton.addEventListener('click', downloadCsv);

    loadRecords();
    renderInventory();
    renderHistory();

    quantityInput.value = '1';
  </script>
</body>
</html>
